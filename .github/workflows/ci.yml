name: CI

on: [push, pull_request]

jobs:
  bb:
    name: babashka (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC for the struct fixture
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The download from objects.githubusercontent.com fails now and then
      # with curl exit 8, a reply curl cannot parse. Retrying clears it.
      - name: Install babashka dev build
        run: |
          for i in 1 2 3; do
            bash <(curl -fsS https://raw.githubusercontent.com/babashka/babashka/master/install) --dev-build --dir bin --dynamic && exit 0
            sleep 5
          done
          exit 1

      # Runs the suite through babashka's built-in babashka.ffi, so the calls
      # go through the compiled trampolines instead of FFM handles.
      - name: Run tests
        run: |
          # bin, not the repository root: bb/ there holds the build helpers
          if [ "$RUNNER_OS" = "Windows" ]; then bb=bin/bb.exe; else bb=bin/bb; fi
          "$bb" test:bb

  jvm:
    name: JVM ${{ matrix.jdk }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        jdk: ['25']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC for the struct fixture
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest

      - name: Run tests
        run: clojure -M:test

  node:
    name: Node.js ${{ matrix.node }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: ['26']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The same command as bb test:node.
      - name: Run tests
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then sep=';'; else sep=':'; fi
          npx --yes nbb@1.5.212 --classpath "src${sep}test-node" -m babashka.ffi-test

  native:
    name: Native image (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # cl for the fixture, and the linker native-image calls
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      # The trampolines and the registered upcall shapes only exist in an
      # image, so this is the only job that runs the branch's code on them.
      - name: Build and run the native image
        run: bb test:native

      # Struct calls and variadic calls go through libffi in an image, so a
      # second image links it. macOS carries libffi in its SDK.
      - name: libffi, Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev
          echo "BABASHKA_LIBFFI=system" >> "$GITHUB_ENV"

      - name: libffi, macOS
        if: runner.os == 'macOS'
        run: echo "BABASHKA_LIBFFI=system" >> "$GITHUB_ENV"

      # a static libffi with the dynamic C runtime native-image links
      - name: libffi, Windows
        if: runner.os == 'Windows'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libffi:x64-windows-static-md
          lib="$(ls "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows-static-md/lib/*ffi*.lib | head -1)"
          echo "BABASHKA_LIBFFI=$(cygpath -w "$lib")" >> "$GITHUB_ENV"

      - name: Build and run the native image with libffi
        run: bb test:native

  cljs:
    name: ClojureScript and shadow-cljs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the ClojureScript compiler loads the macros from ffi.clj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
          bb: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: ClojureScript
        run: bb test:cljs

      - name: ClojureScript, advanced
        run: bb test:cljs advanced

      - name: shadow-cljs
        run: bb test:shadow
